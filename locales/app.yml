  en: "After the initial sync, new and updated topics are highlighted. During the highlight, each expand/collapse arrow on the path gets a green dot; the arrows stay bright for the rest of the session."
  de: "Nach dem initialen Abgleich werden neue und aktualisierte Themen markiert. Während der Aufhellung erhält jedes Auf-/Zuklapp-Dreieck auf dem Pfad einen grünen Punkt; die Dreiecke bleiben dauerhaft hell."
  fr: "Après la synchronisation initiale, les sujets nouveaux et mis à jour sont mis en évidence. Pendant la mise en évidence, chaque flèche de développement du chemin reçoit un point vert ; les flèches restent lumineuses pour le reste de la session."
  ko: "초기 동기화 후 새 토픽과 업데이트된 토픽이 강조됩니다. 강조 중에는 경로의 각 펼치기/접기 화살표에 녹색 점이 표시되며, 화살표는 세션 동안 계속 밝게 유지됩니다."
  zh: "初始同步后，新主题和已更新主题会被高亮。高亮期间，路径上的每个展开/折叠箭头都会显示绿点；箭头在本次会话剩余时间内保持高亮。"
  es: "Tras la sincronización inicial, se resaltan los temas nuevos y actualizados. Durante el resaltado, cada flecha de expandir/contraer de la ruta recibe un punto verde; las flechas permanecen resaltadas durante el resto de la sesión."

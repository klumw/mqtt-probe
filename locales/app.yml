help.quick_start.intro:
  en: "MQTT Probe connects to one broker at a time, shows incoming topics, and lets you publish messages."
  de: "MQTT Probe verbindet sich mit jeweils einem Broker, zeigt eingehende Themen und erlaubt das Veröffentlichen von Nachrichten."
  fr: "MQTT Probe se connecte à un seul broker à la fois, affiche les sujets entrants et permet de publier des messages."
  ko: "MQTT Probe는 한 번에 하나의 브로커에 연결하고, 수신된 토픽을 표시하며, 메시지를 게시할 수 있습니다."
  zh: "MQTT Probe 一次连接一个 Broker，显示收到的主题，并允许发布消息。"
  es: "MQTT Probe se conecta a un broker a la vez, muestra los temas entrantes y permite publicar mensajes."
help.quick_start.profile:
  en: "Create a profile in the left sidebar with “+ New” and enter the broker host and port."
  de: "Lege in der linken Seitenleiste mit „+ Neu“ ein Profil an und trage Broker-Host und Port ein."
  fr: "Créez un profil dans la barre latérale gauche avec « + Nouveau » et saisissez l’hôte et le port du broker."
  ko: "왼쪽 사이드바에서 ‘+ 새로 만들기’로 프로필을 만들고 브로커 호스트와 포트를 입력하세요."
  zh: "在左侧边栏点击“+ 新建”创建配置文件，并输入 Broker 主机和端口。"
  es: "Crea un perfil en la barra lateral izquierda con «+ Nuevo» e introduce el host y el puerto del broker."
help.quick_start.connect:
  en: "Select the profile and press “Connect”. The status dot shows the connection state."
  de: "Wähle das Profil aus und klicke auf „Verbinden“. Der Statuspunkt zeigt den Verbindungszustand."
  fr: "Sélectionnez le profil et cliquez sur « Connecter ». Le point d’état indique la connexion."
  ko: "프로필을 선택하고 ‘연결’을 누르세요. 상태 점이 연결 상태를 보여 줍니다."
  zh: "选择配置文件并点击“连接”。状态点显示连接状态。"
  es: "Selecciona el perfil y pulsa «Conectar». El punto de estado muestra la conexión."
help.quick_start.subscribe:
  en: "Set a subscription topic such as # or sensor/#. Without a subscription the app receives no messages."
  de: "Setze ein Subscription-Thema wie # oder sensor/#. Ohne Subscription empfängt die App keine Nachrichten."
  fr: "Définissez un sujet d’abonnement tel que # ou sensor/#. Sans abonnement, l’application ne reçoit aucun message."
  ko: "# 또는 sensor/# 같은 구독 토픽을 설정하세요. 구독이 없으면 앱은 메시지를 받지 못합니다."
  zh: "设置订阅主题，例如 # 或 sensor/#。没有订阅时应用不会收到任何消息。"
  es: "Define un tema de suscripción como # o sensor/#. Sin suscripción, la aplicación no recibe mensajes."
help.quick_start.publish:
  en: "Open the publish composer at the bottom, enter a topic and payload, then press “Publish” or Ctrl+Enter."
  de: "Öffne unten den Publish-Komposer, trage Thema und Payload ein und klicke auf „Veröffentlichen“ oder drücke Strg+Enter."
  fr: "Ouvrez l’éditeur de publication en bas, saisissez un sujet et une charge utile, puis cliquez sur « Publier » ou appuyez sur Ctrl+Entrée."
  ko: "아래의 게시 작성기를 열고 토픽과 페이로드를 입력한 뒤 ‘게시’를 누르거나 Ctrl+Enter를 누르세요."
  zh: "打开底部的发布编辑器，输入主题和负载，然后点击“发布”或按 Ctrl+Enter。"
  es: "Abre el editor de publicación en la parte inferior, introduce un tema y una carga útil y pulsa «Publicar» o Ctrl+Enter."
help.basics.intro:
  en: "The most important MQTT terms used in this application."
  de: "Die wichtigsten MQTT-Begriffe in dieser Anwendung."
  fr: "Les principaux termes MQTT utilisés dans cette application."
  ko: "이 애플리케이션에서 사용하는 주요 MQTT 용어입니다."
  zh: "本应用中使用的主要 MQTT 术语。"
  es: "Los términos MQTT más importantes de esta aplicación."
help.basics.topics_term:
  en: "Topics and wildcards"
  de: "Themen und Wildcards"
  fr: "Sujets et caractères génériques"
  ko: "토픽과 와일드카드"
  zh: "主题与通配符"
  es: "Temas y comodines"
help.basics.topics:
  en: "Slash-separated paths. + matches one level, # matches all remaining levels. Matching is case-sensitive and a leading slash is significant."
  de: "Durch Schrägstriche getrennte Pfade. + entspricht genau einer Ebene, # allen restlichen Ebenen. Groß-/Kleinschreibung zählt, ein führender Schrägstrich ist bedeutsam."
  fr: "Chemins séparés par des barres obliques. + correspond à un niveau, # à tous les niveaux restants. La casse et la barre oblique initiale sont significatives."
  ko: "슬래시로 구분된 경로입니다. +는 한 단계, #는 나머지 모든 단계와 일치합니다. 대소문자와 앞의 슬래시가 중요합니다."
  zh: "以斜杠分隔的路径。+ 匹配一级，# 匹配其余所有层级。匹配区分大小写，开头的斜杠也有意义。"
  es: "Rutas separadas por barras. + coincide con un nivel y # con todos los niveles restantes. Se distingue entre mayúsculas y minúsculas, y la barra inicial es significativa."
help.basics.qos:
  en: "QoS 0 is at most once, QoS 1 at least once, and QoS 2 exactly once. Subscription and publish QoS are set separately."
  de: "QoS 0 bedeutet höchstens einmal, QoS 1 mindestens einmal und QoS 2 genau einmal. Subscription- und Publish-QoS werden getrennt gesetzt."
  fr: "QoS 0 : au plus une fois, QoS 1 : au moins une fois, QoS 2 : exactement une fois. Les QoS d’abonnement et de publication se règlent séparément."
  ko: "QoS 0은 최대 한 번, QoS 1은 최소 한 번, QoS 2는 정확히 한 번입니다. 구독 QoS와 게시 QoS는 따로 설정합니다."
  zh: "QoS 0 最多一次，QoS 1 至少一次，QoS 2 恰好一次。订阅和发布的 QoS 分别设置。"
  es: "QoS 0 es como máximo una vez, QoS 1 al menos una vez y QoS 2 exactamente una vez. La QoS de suscripción y de publicación se configuran por separado."
help.basics.retained:
  en: "The broker stores the last retained message per topic and replays it after a new subscription. An empty retained payload deletes the topic."
  de: "Der Broker speichert die letzte retained Nachricht pro Thema und spielt sie nach einer neuen Subscription erneut aus. Ein leerer retained Payload löscht das Thema."
  fr: "Le broker conserve le dernier message retenu par sujet et le rejoue après un nouvel abonnement. Une charge utile retenue vide supprime le sujet."
  ko: "브로커는 토픽별 마지막 retained 메시지를 저장하고 새 구독 시 다시 보냅니다. 빈 retained 페이로드는 토픽을 삭제합니다."
  zh: "Broker 为每个主题保存最后一条保留消息，并在新订阅后重新发送。空的保留负载会删除该主题。"
  es: "El broker guarda el último mensaje retenido por tema y lo reenvía tras una nueva suscripción. Una carga útil retenida vacía elimina el tema."
help.basics.clean_session:
  en: "With a clean session the broker discards previous subscription state when the client disconnects."
  de: "Bei einer Clean Session verwirft der Broker den bisherigen Subscription-Zustand, wenn der Client die Verbindung trennt."
  fr: "Avec une session propre, le broker supprime l’état d’abonnement précédent lorsque le client se déconnecte."
  ko: "클린 세션에서는 클라이언트 연결이 끊길 때 브로커가 이전 구독 상태를 삭제합니다."
  zh: "使用清理会话时，客户端断开后 Broker 会丢弃之前的订阅状态。"
  es: "Con una sesión limpia, el broker descarta el estado de suscripción anterior cuando el cliente se desconecta."
help.basics.keep_alive:
  en: "Interval in seconds in which the client contacts the broker. If the broker stays silent for too long, the connection is treated as lost."
  de: "Intervall in Sekunden, in dem der Client den Broker kontaktiert. Bleibt der Broker zu lange still, gilt die Verbindung als verloren."
  fr: "Intervalle en secondes pendant lequel le client contacte le broker. Si le broker reste silencieux trop longtemps, la connexion est considérée comme perdue."
  ko: "클라이언트가 브로커에 접속하는 간격(초)입니다. 브로커가 너무 오래 응답하지 않으면 연결이 끊긴 것으로 간주합니다."
  zh: "客户端联系 Broker 的间隔（秒）。如果 Broker 长时间无响应，连接将被视为丢失。"
  es: "Intervalo en segundos en el que el cliente contacta con el broker. Si el broker permanece en silencio demasiado tiempo, la conexión se considera perdida."
help.basics.transports:
  en: "TCP, TLS, WebSocket (ws) and Secure WebSocket (wss). TLS and WSS can additionally trust a custom CA certificate."
  de: "TCP, TLS, WebSocket (ws) und Secure WebSocket (wss). TLS und WSS können zusätzlich ein eigenes CA-Zertifikat vertrauen."
  fr: "TCP, TLS, WebSocket (ws) et WebSocket sécurisé (wss). TLS et WSS peuvent faire confiance à un certificat CA supplémentaire."
  ko: "TCP, TLS, WebSocket(ws), 보안 WebSocket(wss)을 지원합니다. TLS와 WSS는 추가 CA 인증서를 신뢰할 수 있습니다."
  zh: "支持 TCP、TLS、WebSocket（ws）和安全 WebSocket（wss）。TLS 和 WSS 还可信任自定义 CA 证书。"
  es: "TCP, TLS, WebSocket (ws) y WebSocket seguro (wss). TLS y WSS pueden confiar además en un certificado CA personalizado."
help.overview.intro:
  en: "The main window is divided into four areas:"
  de: "Das Hauptfenster ist in vier Bereiche gegliedert:"
  fr: "La fenêtre principale est divisée en quatre zones :"
  ko: "기본 창은 네 영역으로 나뉩니다:"
  zh: "主窗口分为四个区域："
  es: "La ventana principal se divide en cuatro áreas:"
help.overview.areas:
  en: "Top bar with the active connection selector and the Log, Settings and Help buttons; left sidebar with profiles and broker info; center with the topic tree; right with the details of the selected topic."
  de: "Obere Leiste mit Verbindungsauswahl sowie Protokoll-, Einstellungen- und Hilfe-Button; linke Seitenleiste mit Profilen und Broker-Info; Mitte mit dem Themenbaum; rechts die Details des ausgewählten Themas."
  fr: "Barre supérieure avec le sélecteur de connexion et les boutons Journal, Paramètres et Aide ; barre latérale gauche avec les profils et les infos broker ; centre avec l’arborescence ; droite avec les détails du sujet sélectionné."
  ko: "상단 표시줄에는 활성 연결 선택기와 로그/Settings/Help 버튼, 왼쪽 사이드바에는 프로필과 브로커 정보, 가운데에는 토픽 트리, 오른쪽에는 선택한 토픽의 세부 정보가 있습니다."
  zh: "顶部栏包含活动连接选择器以及日志、设置和帮助按钮；左侧边栏显示配置文件和 Broker 信息；中间是主题树；右侧是所选主题的详细信息。"
  es: "Barra superior con el selector de conexión activa y los botones Registro, Ajustes y Ayuda; barra lateral izquierda con perfiles e información del broker; centro con el árbol de temas; derecha con los detalles del tema seleccionado."
help.overview.publish:
  en: "The publish composer sits at the bottom and can be collapsed."
  de: "Der Publish-Komposer befindet sich unten und lässt sich einklappen."
  fr: "L’éditeur de publication se trouve en bas et peut être replié."
  ko: "게시 작성기는 아래쪽에 있으며 접을 수 있습니다."
  zh: "发布编辑器位于底部，可以折叠。"
  es: "El editor de publicación está en la parte inferior y se puede contraer."
help.overview.toasts:
  en: "Short notifications appear at the bottom right and disappear automatically."
  de: "Kurze Benachrichtigungen erscheinen unten rechts und verschwinden automatisch."
  fr: "De brèves notifications apparaissent en bas à droite et disparaissent automatiquement."
  ko: "짧은 알림이 오른쪽 아래에 표시되었다가 자동으로 사라집니다."
  zh: "简短通知显示在右下角并自动消失。"
  es: "Las notificaciones breves aparecen abajo a la derecha y desaparecen automáticamente."
help.connections.intro:
  en: "Profiles are managed in the left sidebar and stored in the configuration file."
  de: "Profile werden in der linken Seitenleiste verwaltet und in der Konfigurationsdatei gespeichert."
  fr: "Les profils sont gérés dans la barre latérale gauche et enregistrés dans le fichier de configuration."
  ko: "프로필은 왼쪽 사이드바에서 관리되며 구성 파일에 저장됩니다."
  zh: "配置文件在左侧边栏管理，并保存在配置文件中。"
  es: "Los perfiles se gestionan en la barra lateral izquierda y se guardan en el archivo de configuración."
help.connections.list_row:
  en: "Each row shows the status dot, name, an AUTO badge for the startup profile, endpoint, transport badge and live counters."
  de: "Jede Zeile zeigt Statuspunkt, Name, ein AUTO-Badge für das Startprofil, Endpoint, Transport-Badge und Live-Zähler."
  fr: "Chaque ligne affiche le point d’état, le nom, un badge AUTO pour le profil de démarrage, le point de terminaison, le badge de transport et les compteurs en direct."
  ko: "각 행은 상태 점, 이름, 시작 프로필용 AUTO 배지, 엔드포인트, 전송 배지 및 실시간 카운터를 보여 줍니다."
  zh: "每行显示状态点、名称、启动配置文件的 AUTO 标记、端点、传输标记和实时计数。"
  es: "Cada fila muestra el punto de estado, el nombre, una etiqueta AUTO para el perfil de inicio, el endpoint, la etiqueta de transporte y los contadores en vivo."
help.connections.list_actions:
  en: "Connect or disconnect the profile, edit it, or remove it with ×. Deleting asks for confirmation."
  de: "Profil verbinden oder trennen, bearbeiten oder mit × entfernen. Das Löschen verlangt eine Bestätigung."
  fr: "Connectez ou déconnectez le profil, modifiez-le ou supprimez-le avec ×. La suppression demande confirmation."
  ko: "프로필을 연결/해제하거나 편집하거나 ×로 삭제할 수 있습니다. 삭제 시 확인을 요청합니다."
  zh: "可以连接或断开配置文件、编辑它，或用 × 删除。删除前会请求确认。"
  es: "Conecta o desconecta el perfil, edítalo o elimínalo con ×. La eliminación pide confirmación."
help.connections.one_active:
  en: "Only one connection can be active at a time. Connecting another profile disconnects the current one first."
  de: "Es kann immer nur eine Verbindung aktiv sein. Beim Verbinden eines anderen Profils wird die aktuelle zuerst getrennt."
  fr: "Une seule connexion peut être active à la fois. La connexion d’un autre profil déconnecte d’abord la connexion actuelle."
  ko: "한 번에 하나의 연결만 활성화할 수 있습니다. 다른 프로필을 연결하면 현재 연결이 먼저 끊깁니다."
  zh: "同一时间只能有一个活动连接。连接另一个配置文件会先断开当前连接。"
  es: "Solo puede haber una conexión activa a la vez. Al conectar otro perfil se desconecta primero el actual."
help.connections.broker_info:
  en: "The broker info card shows endpoint, subscription, uptime, message and topic counters, and the last log or error."
  de: "Die Broker-Info zeigt Endpoint, Subscription, Laufzeit, Nachrichten- und Themenzähler sowie den letzten Logeintrag oder Fehler."
  fr: "La fiche broker affiche le point de terminaison, l’abonnement, la durée, les compteurs de messages et de sujets, ainsi que le dernier journal ou la dernière erreur."
  ko: "브로커 정보 카드는 엔드포인트, 구독, 가동 시간, 메시지/토픽 카운터, 마지막 로그 또는 오류를 보여 줍니다."
  zh: "Broker 信息卡显示端点、订阅、运行时间、消息和主题计数，以及最后一条日志或错误。"
  es: "La tarjeta de información del broker muestra endpoint, suscripción, tiempo activo, contadores de mensajes y temas, y el último registro o error."
help.connections.editor_heading:
  en: "Profile editor"
  de: "Profil-Editor"
  fr: "Éditeur de profil"
  ko: "프로필 편집기"
  zh: "配置文件编辑器"
  es: "Editor de perfil"
help.connections.name:
  en: "Display name in the sidebar. Generated default names follow the UI language."
  de: "Anzeigename in der Seitenleiste. Automatisch erzeugte Standardnamen folgen der UI-Sprache."
  fr: "Nom affiché dans la barre latérale. Les noms par défaut générés suivent la langue de l’interface."
  ko: "사이드바에 표시되는 이름입니다. 자동 생성된 기본 이름은 UI 언어를 따릅니다."
  zh: "侧边栏中显示的名称。自动生成的默认名称会跟随界面语言。"
  es: "Nombre mostrado en la barra lateral. Los nombres predeterminados generados siguen el idioma de la interfaz."
help.connections.host:
  en: "Host name only, without ws:// or http://. The scheme is selected through Transport."
  de: "Nur der Hostname, ohne ws:// oder http://. Das Schema wird über den Transport gewählt."
  fr: "Uniquement le nom d’hôte, sans ws:// ni http://. Le schéma est choisi via le transport."
  ko: "ws:// 또는 http:// 없이 호스트 이름만 입력하세요. 스킴은 전송 설정에서 선택합니다."
  zh: "仅输入主机名，不要包含 ws:// 或 http://。协议由传输设置选择。"
  es: "Solo el nombre del host, sin ws:// ni http://. El esquema se elige mediante el transporte."
help.connections.port:
  en: "Broker port, for example 1883 for TCP, 8883 for TLS, 8000 for HiveMQ WebSocket, or 8884 for HiveMQ WSS."
  de: "Broker-Port, zum Beispiel 1883 für TCP, 8883 für TLS, 8000 für HiveMQ-WebSocket oder 8884 für HiveMQ-WSS."
  fr: "Port du broker, par exemple 1883 pour TCP, 8883 pour TLS, 8000 pour WebSocket HiveMQ ou 8884 pour WSS HiveMQ."
  ko: "브로커 포트입니다. 예: TCP 1883, TLS 8883, HiveMQ WebSocket 8000, HiveMQ WSS 8884."
  zh: "Broker 端口，例如 TCP 1883、TLS 8883、HiveMQ WebSocket 8000 或 HiveMQ WSS 8884。"
  es: "Puerto del broker, por ejemplo 1883 para TCP, 8883 para TLS, 8000 para WebSocket de HiveMQ u 8884 para WSS de HiveMQ."
help.connections.transport:
  en: "TCP, TLS, WebSocket (ws) or Secure WebSocket (wss)."
  de: "TCP, TLS, WebSocket (ws) oder Secure WebSocket (wss)."
  fr: "TCP, TLS, WebSocket (ws) ou WebSocket sécurisé (wss)."
  ko: "TCP, TLS, WebSocket(ws) 또는 보안 WebSocket(wss)입니다."
  zh: "TCP、TLS、WebSocket（ws）或安全 WebSocket（wss）。"
  es: "TCP, TLS, WebSocket (ws) o WebSocket seguro (wss)."
help.connections.ws_path:
  en: "HTTP path of the WebSocket endpoint; HiveMQ defaults to /mqtt."
  de: "HTTP-Pfad des WebSocket-Endpunkts; bei HiveMQ standardmäßig /mqtt."
  fr: "Chemin HTTP du point de terminaison WebSocket ; par défaut /mqtt chez HiveMQ."
  ko: "WebSocket 엔드포인트의 HTTP 경로입니다. HiveMQ 기본값은 /mqtt입니다."
  zh: "WebSocket 端点的 HTTP 路径；HiveMQ 默认为 /mqtt。"
  es: "Ruta HTTP del endpoint WebSocket; en HiveMQ es /mqtt por defecto."
help.connections.ca:
  en: "Optional PEM or DER root certificate for TLS and WSS. System certificates remain trusted."
  de: "Optionales Root-Zertifikat im PEM- oder DER-Format für TLS und WSS. Systemzertifikate bleiben vertrauenswürdig."
  fr: "Certificat racine PEM ou DER facultatif pour TLS et WSS. Les certificats système restent approuvés."
  ko: "TLS 및 WSS용 선택적 PEM/DER 루트 인증서입니다. 시스템 인증서는 계속 신뢰됩니다."
  zh: "用于 TLS 和 WSS 的可选 PEM 或 DER 根证书。系统证书仍然受信任。"
  es: "Certificado raíz PEM o DER opcional para TLS y WSS. Los certificados del sistema siguen siendo de confianza."
help.connections.client_certificate:
  en: "Optional client certificate chain for mutual TLS (PEM or DER). The broker must request a client certificate."
  de: "Optionale Client-Zertifikatskette für gegenseitiges TLS (PEM oder DER). Der Broker muss ein Client-Zertifikat anfordern."
  fr: "Chaîne de certificats client facultative pour TLS mutuel (PEM ou DER). Le broker doit demander un certificat client."
  ko: "상호 TLS용 선택적 클라이언트 인증서 체인(PEM 또는 DER)입니다. 브로커가 클라이언트 인증서를 요청해야 합니다."
  zh: "用于双向 TLS 的可选客户端证书链（PEM 或 DER）。Broker 必须请求客户端证书。"
  es: "Cadena de certificados de cliente opcional para TLS mutuo (PEM o DER). El broker debe solicitar un certificado de cliente."
help.connections.client_key:
  en: "Unencrypted private key for the client certificate (PKCS#1, PKCS#8, or SEC1; PEM or DER)."
  de: "Unverschlüsselter privater Schlüssel zum Client-Zertifikat (PKCS#1, PKCS#8 oder SEC1; PEM oder DER)."
  fr: "Clé privée non chiffrée du certificat client (PKCS#1, PKCS#8 ou SEC1 ; PEM ou DER)."
  ko: "클라이언트 인증서의 암호화되지 않은 개인 키(PKCS#1, PKCS#8 또는 SEC1, PEM 또는 DER)입니다."
  zh: "客户端证书的未加密私钥（PKCS#1、PKCS#8 或 SEC1；PEM 或 DER）。"
  es: "Clave privada sin cifrar del certificado de cliente (PKCS#1, PKCS#8 o SEC1; PEM o DER)."
help.connections.certificates_heading:
  en: "TLS certificates"
  de: "TLS-Zertifikate"
  fr: "Certificats TLS"
  ko: "TLS 인증서"
  zh: "TLS 证书"
  es: "Certificados TLS"
help.connections.certificate_version:
  en: "MQTT Probe only accepts server-side certificates in X.509 version 3 or later. Brokers that present older certificates (v1 or v2) are rejected during the TLS handshake with “UnsupportedCertVersion”."
  de: "MQTT Probe akzeptiert serverseitige Zertifikate nur ab X.509-Version 3. Broker, die ältere Zertifikate (v1 oder v2) ausliefern, werden beim TLS-Handshake mit „UnsupportedCertVersion“ abgelehnt."
  fr: "MQTT Probe n’accepte que les certificats côté serveur en version X.509 3 ou supérieure. Les brokers présentant des certificats plus anciens (v1 ou v2) sont rejetés lors de la poignée de main TLS avec « UnsupportedCertVersion »."
  ko: "MQTT Probe는 서버 측 인증서로 X.509 버전 3 이상만 허용합니다. 이전 버전(v1 또는 v2) 인증서를 제공하는 브로커는 TLS 핸드셰이크에서 “UnsupportedCertVersion” 오류로 거부됩니다."
  zh: "MQTT Probe 仅接受 X.509 版本 3 或更高版本的服务器端证书。提供旧版本（v1 或 v2）证书的 Broker 会在 TLS 握手时被拒绝，并显示“UnsupportedCertVersion”。"
  es: "MQTT Probe solo acepta certificados del lado del servidor en versión X.509 3 o superior. Los brokers que presenten certificados más antiguos (v1 o v2) se rechazan durante el handshake TLS con «UnsupportedCertVersion»."
help.connections.auth:
  en: "Optional username and password. Passwords are kept in memory unless “Save password in profile” is enabled; then they are stored in plain text in the configuration file."
  de: "Optionales Benutzername/Passwort. Passwörter bleiben im Arbeitsspeicher, sofern „Passwort im Profil speichern“ nicht aktiviert ist; dann stehen sie im Klartext in der Konfigurationsdatei."
  fr: "Nom d’utilisateur et mot de passe facultatifs. Les mots de passe restent en mémoire sauf si « Enregistrer le mot de passe dans le profil » est activé ; ils sont alors stockés en clair dans le fichier de configuration."
  ko: "선택적 사용자 이름과 비밀번호입니다. ‘프로필에 비밀번호 저장’이 꺼져 있으면 비밀번호는 메모리에만 유지되며, 켜면 구성 파일에 일반 텍스트로 저장됩니다."
  zh: "可选的用户名和密码。除非启用“在配置文件中保存密码”，密码只保存在内存中；启用后会以明文写入配置文件。"
  es: "Nombre de usuario y contraseña opcionales. Las contraseñas se mantienen en memoria salvo que se active «Guardar la contraseña en el perfil»; en ese caso se almacenan en texto plano en el archivo de configuración."
help.connections.client_id:
  en: "MQTT client identifier. A unique ID is generated when the field is empty."
  de: "MQTT-Client-ID. Bei leerem Feld wird automatisch eine eindeutige ID erzeugt."
  fr: "Identifiant client MQTT. Un identifiant unique est généré si le champ est vide."
  ko: "MQTT 클라이언트 ID입니다. 비워 두면 고유 ID가 자동 생성됩니다."
  zh: "MQTT 客户端标识符。字段为空时会自动生成唯一 ID。"
  es: "Identificador de cliente MQTT. Si el campo está vacío se genera un ID único."
help.connections.keep_alive:
  en: "Keep-alive interval in seconds, clamped to 5–3600."
  de: "Keep-Alive-Intervall in Sekunden, begrenzt auf 5–3600."
  fr: "Intervalle de keep-alive en secondes, limité à 5–3600."
  ko: "Keep-alive 간격(초)이며 5–3600 범위입니다."
  zh: "Keep-alive 间隔（秒），范围为 5–3600。"
  es: "Intervalo de keep-alive en segundos, limitado a 5–3600."
help.connections.clean_session:
  en: "Requests a clean session from the broker."
  de: "Fordert beim Broker eine saubere Sitzung an."
  fr: "Demande une session propre au broker."
  ko: "브로커에 클린 세션을 요청합니다."
  zh: "向 Broker 请求清理会话。"
  es: "Solicita una sesión limpia al broker."
help.connections.subscription:
  en: "Topic filter subscribed after connecting. If it is empty, the app receives no messages."
  de: "Themenfilter, der nach dem Verbinden abonniert wird. Ist er leer, empfängt die App keine Nachrichten."
  fr: "Filtre de sujets abonné après la connexion. S’il est vide, l’application ne reçoit aucun message."
  ko: "연결 후 구독할 토픽 필터입니다. 비어 있으면 앱이 메시지를 받지 못합니다."
  zh: "连接后订阅的主题过滤器。如果为空，应用不会收到任何消息。"
  es: "Filtro de temas suscrito tras conectar. Si está vacío, la aplicación no recibe mensajes."
help.connections.subscribe_qos:
  en: "QoS requested for the subscription (0–2)."
  de: "QoS für die Subscription (0–2)."
  fr: "QoS demandée pour l’abonnement (0–2)."
  ko: "구독에 요청할 QoS(0–2)입니다."
  zh: "订阅请求的 QoS（0–2）。"
  es: "QoS solicitada para la suscripción (0–2)."
help.connections.auto_connect:
  en: "Marks the profile that connects at startup. Only one profile can carry this flag; enabling it elsewhere clears the previous one."
  de: "Markiert das Profil, das beim Start verbindet. Nur ein Profil kann dieses Flag tragen; das Aktivieren anderswo löscht das vorherige."
  fr: "Marque le profil qui se connecte au démarrage. Un seul profil peut porter ce drapeau ; l’activer ailleurs efface le précédent."
  ko: "시작 시 연결할 프로필을 표시합니다. 하나의 프로필만 이 플래그를 가질 수 있으며, 다른 곳에서 활성화하면 이전 플래그가 해제됩니다."
  zh: "标记启动时连接的配置文件。只能有一个配置文件带有此标记；在其他位置启用会清除之前的标记。"
  es: "Marca el perfil que se conecta al iniciar. Solo un perfil puede tener esta marca; activarla en otro borra la anterior."
help.tree.intro:
  en: "The topic tree shows all messages received for the active connection."
  de: "Der Themenbaum zeigt alle für die aktive Verbindung empfangenen Nachrichten."
  fr: "L’arborescence affiche tous les messages reçus pour la connexion active."
  ko: "토픽 트리는 활성 연결에 대해 수신된 모든 메시지를 보여 줍니다."
  zh: "主题树显示活动连接收到的所有消息。"
  es: "El árbol de temas muestra todos los mensajes recibidos para la conexión activa."
help.tree.filter:
  en: "The filter field narrows the tree. Ctrl+F focuses it, Esc clears it. If enabled in Settings, it also searches payloads."
  de: "Das Filterfeld schränkt den Baum ein. Strg+F fokussiert es, Esc leert es. Wenn in den Einstellungen aktiviert, durchsucht es auch Payloads."
  fr: "Le champ de filtre restreint l’arborescence. Ctrl+F le cible, Échap le vide. S’il est activé dans les paramètres, il recherche aussi dans les charges utiles."
  ko: "필터 필드는 트리를 좁힙니다. Ctrl+F로 포커스하고 Esc로 지웁니다. 설정에서 활성화하면 페이로드도 검색합니다."
  zh: "过滤字段用于缩小主题树范围。Ctrl+F 聚焦，Esc 清除。如果在设置中启用，也会搜索负载内容。"
  es: "El campo de filtro reduce el árbol. Ctrl+F lo enfoca y Esc lo borra. Si está activado en Ajustes, también busca en las cargas útiles."
help.tree.expand:
  en: "Use the arrows to expand or collapse branches; Expand all and Collapse all apply to the whole tree."
  de: "Mit den Pfeilen lassen sich Zweige auf- und zuklappen; „Aufklappen“ und „Zuklappen“ gelten für den gesamten Baum."
  fr: "Utilisez les flèches pour développer ou réduire les branches ; « Tout développer » et « Tout réduire » s’appliquent à toute l’arborescence."
  ko: "화살표로 가지를 펼치거나 접을 수 있으며, ‘모두 펼치기’와 ‘모두 접기’는 전체 트리에 적용됩니다."
  zh: "使用箭头展开或折叠分支；“全部展开”和“全部折叠”作用于整棵树。"
  es: "Usa las flechas para expandir o contraer ramas; «Expandir todo» y «Contraer todo» se aplican a todo el árbol."
help.tree.clear:
  en: "Clear removes all locally stored topics for the active connection immediately."
  de: "„Leeren“ entfernt sofort alle lokal gespeicherten Themen der aktiven Verbindung."
  fr: "« Vider » supprime immédiatement tous les sujets stockés localement pour la connexion active."
  ko: "‘비우기’는 활성 연결의 로컬 저장 토픽을 즉시 모두 제거합니다."
  zh: "“清空”会立即删除活动连接的所有本地主题。"
  es: "«Vaciar» elimina de inmediato todos los temas almacenados localmente de la conexión activa."
help.tree.tooltip:
  en: "Hovering a topic shows its path, message count, stored count and a payload preview."
  de: "Beim Überfahren eines Themas werden Pfad, Nachrichtenzahl, gespeicherte Anzahl und eine Payload-Vorschau angezeigt."
  fr: "Survoler un sujet affiche son chemin, le nombre de messages, le nombre stocké et un aperçu de la charge utile."
  ko: "토픽 위에 마우스를 올리면 경로, 메시지 수, 저장 수 및 페이로드 미리보기가 표시됩니다."
  zh: "将鼠标悬停在主题上会显示路径、消息数、存储数和负载预览。"
  es: "Al pasar el ratón por un tema se muestra su ruta, el número de mensajes, el número almacenado y una vista previa de la carga útil."
help.tree.context:
  en: "The context menu copies the topic, uses it as the publish topic, removes it from the local view, or deletes retained messages at the broker."
  de: "Das Kontextmenü kopiert das Thema, übernimmt es als Publish-Thema, entfernt es aus der lokalen Ansicht oder löscht retained Nachrichten beim Broker."
  fr: "Le menu contextuel copie le sujet, l’utilise comme sujet de publication, le retire de la vue locale ou supprime des messages retenus sur le broker."
  ko: "컨텍스트 메뉴에서 토픽을 복사하거나 게시 토픽으로 사용하거나 로컬 보기에서 제거하거나 브로커의 retained 메시지를 삭제할 수 있습니다."
  zh: "上下文菜单可以复制主题、将其用作发布主题、从本地视图中移除，或删除 Broker 上的保留消息。"
  es: "El menú contextual copia el tema, lo usa como tema de publicación, lo quita de la vista local o elimina mensajes retenidos en el broker."
help.tree.retained_delete:
  en: "The context menu deletes a retained message or all retained messages in a branch by publishing an empty retained payload for each topic, as defined by MQTT. A confirmation is required."
  de: "Das Kontextmenü löscht eine retained Nachricht oder alle retained Nachrichten eines Zweigs, indem es – wie im MQTT-Protokoll vorgesehen – für jedes Thema einen leeren retained Payload publiziert. Vorher ist eine Bestätigung nötig."
  fr: "Le menu contextuel supprime un message retenu ou tous les messages retenus d’une branche en publiant une charge utile retenue vide pour chaque sujet, conformément à MQTT. Une confirmation est requise."
  ko: "컨텍스트 메뉴는 MQTT 규칙에 따라 각 토픽에 빈 retained 페이로드를 게시하여 retained 메시지 하나 또는 브랜치의 모든 retained 메시지를 삭제합니다. 확인이 필요합니다."
  zh: "上下文菜单通过为每个主题发布空的保留负载来删除一条保留消息或一个分支中的所有保留消息（符合 MQTT 规范），操作前需要确认。"
  es: "El menú contextual elimina un mensaje retenido o todos los mensajes retenidos de una rama publicando una carga útil retenida vacía para cada tema, tal como define MQTT. Se requiere confirmación."
help.tree.restore:
  en: "With “restore previous topics” enabled, the last visible tree is restored after connecting; retained messages for other topics are ignored."
  de: "Mit „zuletzt angezeigte Themen wiederherstellen“ wird nach dem Verbinden der letzte sichtbare Baum geladen; retained Nachrichten anderer Themen werden ignoriert."
  fr: "Avec « restaurer les sujets précédents », la dernière arborescence visible est restaurée après la connexion ; les messages retenus des autres sujets sont ignorés."
  ko: "‘이전 토픽 복원’이 켜져 있으면 연결 후 마지막으로 표시된 트리가 복원되며, 다른 토픽의 retained 메시지는 무시됩니다."
  zh: "启用“恢复之前的主题”后，连接时会恢复上次可见的主题树；其他主题的保留消息将被忽略。"
  es: "Con «restaurar temas anteriores» activado, se restaura el último árbol visible tras conectar; los mensajes retenidos de otros temas se ignoran."
help.tree.highlight:
  en: "New and updated topics are highlighted. During the highlight, the expand/collapse arrows on the path get green dots."
  de: "Neue und aktualisierte Themen werden hervorgehoben. Währenddessen erhalten die Auf-/Zuklapp-Pfeile auf dem Pfad grüne Punkte."
  fr: "Les sujets nouveaux et mis à jour sont mis en évidence. Pendant cette mise en évidence, les flèches de développement du chemin reçoivent un point vert."
  ko: "새 토픽과 업데이트된 토픽이 강조됩니다. 강조 중에는 경로의 펼치기/접기 화살표에 녹색 점이 표시됩니다."
  zh: "新主题和更新主题会被高亮。高亮期间，路径上的展开/折叠箭头会显示绿点。"
  es: "Los temas nuevos y actualizados se resaltan. Durante el resaltado, las flechas de expandir/contraer de la ruta muestran puntos verdes."
help.details.intro:
  en: "The right panel shows the selected topic."
  de: "Das rechte Panel zeigt das ausgewählte Thema."
  fr: "Le panneau de droite affiche le sujet sélectionné."
  ko: "오른쪽 패널은 선택한 토픽을 보여 줍니다."
  zh: "右侧面板显示所选主题。"
  es: "El panel derecho muestra el tema seleccionado."
help.details.header:
  en: "The header shows the path, a copy button, RETAINED/QoS/size/BINARY badges, counters and timestamps. Delete topic, Clear history and Publish use are available here as well."
  de: "Der Kopfbereich zeigt Pfad, Kopieren-Button, RETAINED/QoS/Größe/BINARY-Badges, Zähler und Zeitstempel. Hier stehen auch Thema löschen, Verlauf leeren und für Publish übernehmen zur Verfügung."
  fr: "L’en-tête affiche le chemin, un bouton de copie, les badges RETAINED/QoS/taille/BINARY, les compteurs et les horodatages. Supprimer le sujet, vider l’historique et utiliser pour publier sont également disponibles ici."
  ko: "헤더에는 경로, 복사 버튼, RETAINED/QoS/크기/BINARY 배지, 카운터 및 타임스탬프가 표시됩니다. 여기에서 토픽 삭제, 기록 지우기, 게시에 사용도 가능합니다."
  zh: "标题区显示路径、复制按钮、RETAINED/QoS/大小/BINARY 标记、计数和时间戳。这里还提供删除主题、清空历史记录和用于发布操作。"
  es: "La cabecera muestra la ruta, un botón de copia, las etiquetas RETAINED/QoS/tamaño/BINARY, los contadores y las marcas de tiempo. Aquí también están disponibles Eliminar tema, Vaciar historial y Usar para publicar."
help.details.value:
  en: "Value shows the payload as Text, JSON or Hex. JSON is pretty-printed when enabled in Settings; the value can be copied."
  de: "„Wert“ zeigt den Payload als Text, JSON oder Hex. JSON wird bei aktivierter Einstellung formatiert; der Wert lässt sich kopieren."
  fr: "« Valeur » affiche la charge utile en texte, JSON ou hexadécimal. Le JSON est formaté si l’option est activée ; la valeur peut être copiée."
  ko: "‘값’은 페이로드를 텍스트, JSON 또는 Hex로 표시합니다. 설정이 켜져 있으면 JSON이 자동 서식되며 값을 복사할 수 있습니다."
  zh: "“值”以文本、JSON 或十六进制显示负载。启用设置后 JSON 会自动格式化；值可以复制。"
  es: "«Valor» muestra la carga útil como texto, JSON o hexadecimal. El JSON se formatea si está activado en Ajustes; el valor se puede copiar."
help.details.history:
  en: "History lists every stored message. Select one to see the full payload and timestamp."
  de: "„Verlauf“ listet jede gespeicherte Nachricht. Auswahl zeigt vollständigen Payload und Zeitstempel."
  fr: "« Historique » liste chaque message stocké. Sélectionnez-en un pour voir la charge utile complète et l’horodatage."
  ko: "‘기록’은 저장된 모든 메시지를 나열합니다. 하나를 선택하면 전체 페이로드와 타임스탬프를 볼 수 있습니다."
  zh: "“历史记录”列出所有存储的消息。选择一条即可查看完整负载和时间戳。"
  es: "«Historial» enumera todos los mensajes almacenados. Selecciona uno para ver la carga útil completa y la marca de tiempo."
help.details.diff:
  en: "Diff compares the last two messages and highlights added, removed and unchanged content."
  de: "„Diff“ vergleicht die letzten beiden Nachrichten und hebt hinzugefügte, entfernte und unveränderte Inhalte hervor."
  fr: "« Diff » compare les deux derniers messages et met en évidence le contenu ajouté, supprimé et inchangé."
  ko: "‘차이’는 마지막 두 메시지를 비교하고 추가, 삭제, 변경되지 않은 내용을 강조합니다."
  zh: "“差异”比较最后两条消息，并高亮新增、删除和未变化的内容。"
  es: "«Diff» compara los dos últimos mensajes y resalta el contenido añadido, eliminado y sin cambios."
help.details.chart:
  en: "Chart plots numeric values, including nested JSON fields. It shows current, minimum, maximum and average. When the tab is opened, both axes fit all points; they can then be panned and zoomed with the mouse."
  de: "„Diagramm“ stellt numerische Werte dar, auch verschachtelte JSON-Felder. Angezeigt werden aktuell, Minimum, Maximum und Mittel. Beim Öffnen des Tabs passen sich beide Achsen allen Punkten an; danach lassen sie sich mit der Maus verschieben und zoomen."
  fr: "« Graphique » trace les valeurs numériques, y compris les champs JSON imbriqués. Il affiche la valeur actuelle, le minimum, le maximum et la moyenne. À l’ouverture de l’onglet, les deux axes s’ajustent à tous les points ; ils peuvent ensuite être déplacés et zoomés à la souris."
  ko: "‘차트’는 중첩 JSON 필드를 포함한 숫자 값을 그래프로 표시합니다. 현재, 최소, 최대, 평균을 보여 줍니다. 탭을 열면 두 축이 모든 점에 맞춰지고, 이후 마우스로 이동하거나 확대/축소할 수 있습니다."
  zh: "“图表”绘制数值，包括嵌套的 JSON 字段。显示当前值、最小值、最大值和平均值。打开标签页时两个轴都会适应所有数据点；之后可以用鼠标平移和缩放。"
  es: "«Gráfico» representa valores numéricos, incluidos campos JSON anidados. Muestra el valor actual, el mínimo, el máximo y la media. Al abrir la pestaña, ambos ejes se ajustan a todos los puntos; después se pueden desplazar y ampliar con el ratón."
help.details.truncation:
  en: "Very large payloads are truncated according to the maximum display size in Settings."
  de: "Sehr große Payloads werden gemäß der maximalen Anzeigegröße aus den Einstellungen gekürzt."
  fr: "Les charges utiles très volumineuses sont tronquées selon la taille d’affichage maximale définie dans les paramètres."
  ko: "매우 큰 페이로드는 설정의 최대 표시 크기에 따라 잘립니다."
  zh: "非常大的负载会根据设置中的最大显示大小进行截断。"
  es: "Las cargas útiles muy grandes se truncan según el tamaño máximo de visualización de los Ajustes."
help.publish.intro:
  en: "The composer publishes messages to the active connection."
  de: "Der Komposer veröffentlicht Nachrichten über die aktive Verbindung."
  fr: "L’éditeur publie des messages via la connexion active."
  ko: "작성기는 활성 연결을 통해 메시지를 게시합니다."
  zh: "编辑器通过活动连接发布消息。"
  es: "El editor publica mensajes mediante la conexión activa."
help.publish.target:
  en: "The badge shows the target connection. Without an active connection publishing is disabled. The composer can be collapsed; its state is remembered."
  de: "Das Badge zeigt die Zielverbindung. Ohne aktive Verbindung ist Veröffentlichen deaktiviert. Der Komposer lässt sich einklappen; sein Zustand bleibt erhalten."
  fr: "Le badge indique la connexion cible. Sans connexion active, la publication est désactivée. L’éditeur peut être replié ; son état est mémorisé."
  ko: "배지는 대상 연결을 보여 줍니다. 활성 연결이 없으면 게시할 수 없습니다. 작성기는 접을 수 있으며 상태가 기억됩니다."
  zh: "标记显示目标连接。没有活动连接时无法发布。编辑器可以折叠，其状态会被记住。"
  es: "La etiqueta muestra la conexión de destino. Sin conexión activa no se puede publicar. El editor se puede contraer y su estado se recuerda."
help.publish.topic:
  en: "Enter the topic without wildcards. “From selection” copies the topic currently selected in the tree."
  de: "Thema ohne Wildcards eingeben. „Aus Auswahl“ übernimmt das aktuell im Baum ausgewählte Thema."
  fr: "Saisissez le sujet sans caractères génériques. « Depuis la sélection » copie le sujet sélectionné dans l’arborescence."
  ko: "와일드카드 없이 토픽을 입력하세요. ‘선택 항목에서’는 트리에서 선택한 토픽을 복사합니다."
  zh: "输入主题，不要使用通配符。“使用所选”会复制主题树中当前选中的主题。"
  es: "Introduce el tema sin comodines. «De la selección» copia el tema seleccionado en el árbol."
help.publish.payload:
  en: "Type or paste the payload. The content length and the JSON/TEXT badge update while typing."
  de: "Payload eingeben oder einfügen. Content-Length und JSON/TEXT-Badge aktualisieren sich beim Tippen."
  fr: "Saisissez ou collez la charge utile. La longueur et le badge JSON/TEXT se mettent à jour pendant la saisie."
  ko: "페이로드를 입력하거나 붙여넣으세요. 입력하는 동안 Content-Length와 JSON/TEXT 배지가 갱신됩니다."
  zh: "输入或粘贴负载。输入时内容长度和 JSON/TEXT 标记会实时更新。"
  es: "Escribe o pega la carga útil. La longitud y la etiqueta JSON/TEXT se actualizan mientras escribes."
help.publish.format_history:
  en: "Format pretty-prints valid JSON. History reloads topic, payload, QoS and retain from an earlier publication."
  de: "„Formatieren“ formatiert gültiges JSON. „Verlauf“ lädt Thema, Payload, QoS und Retain einer früheren Veröffentlichung."
  fr: "« Formater » met en forme le JSON valide. « Historique » recharge sujet, charge utile, QoS et retenue d’une publication précédente."
  ko: "‘서식’은 유효한 JSON을 정리합니다. ‘기록’은 이전 게시의 토픽, 페이로드, QoS, retain을 불러옵니다."
  zh: "“格式化”会美化有效的 JSON。“历史记录”会重新载入之前发布的主题、负载、QoS 和保留设置。"
  es: "«Formatear» embellece el JSON válido. «Historial» recarga tema, carga útil, QoS y retención de una publicación anterior."
help.publish.qos_retain:
  en: "Choose QoS 0–2 and optionally Retain to have the broker store the message."
  de: "QoS 0–2 wählen und optional Retain aktivieren, damit der Broker die Nachricht speichert."
  fr: "Choisissez QoS 0–2 et éventuellement Retain pour que le broker conserve le message."
  ko: "QoS 0–2를 선택하고 필요하면 Retain을 켜서 브로커가 메시지를 저장하도록 합니다."
  zh: "选择 QoS 0–2，并可启用 Retain，让 Broker 保存消息。"
  es: "Elige QoS 0–2 y, opcionalmente, Retain para que el broker guarde el mensaje."
help.publish.shortcut:
  en: "Ctrl+Enter publishes from anywhere in the main window."
  de: "Strg+Enter veröffentlicht aus dem gesamten Hauptfenster."
  fr: "Ctrl+Entrée publie depuis toute la fenêtre principale."
  ko: "Ctrl+Enter는 기본 창 어디에서나 게시합니다."
  zh: "Ctrl+Enter 可在主窗口任意位置发布。"
  es: "Ctrl+Enter publica desde cualquier parte de la ventana principal."
help.settings.intro:
  en: "Open Settings from the top bar. Changes are applied immediately."
  de: "Öffne die Einstellungen über die obere Leiste. Änderungen wirken sofort."
  fr: "Ouvrez les paramètres depuis la barre supérieure. Les modifications s’appliquent immédiatement."
  ko: "상단 표시줄에서 설정을 여세요. 변경 사항은 즉시 적용됩니다."
  zh: "从顶部栏打开设置。更改会立即生效。"
  es: "Abre los ajustes desde la barra superior. Los cambios se aplican de inmediato."
help.settings.appearance:
  en: "Appearance switches between the dark and light color scheme."
  de: "„Darstellung“ wechselt zwischen dunklem und hellem Farbschema."
  fr: "« Apparence » bascule entre le thème sombre et le thème clair."
  ko: "‘모양’에서 어두운 테마와 밝은 테마를 전환합니다."
  zh: "“外观”在深色和浅色主题之间切换。"
  es: "«Apariencia» alterna entre el tema oscuro y el claro."
help.settings.language:
  en: "Language offers English, German, French, Korean, Chinese and Spanish. The selection applies immediately and is stored."
  de: "„Sprache“ bietet Englisch, Deutsch, Französisch, Koreanisch, Chinesisch und Spanisch. Die Auswahl wirkt sofort und wird gespeichert."
  fr: "« Langue » propose l’anglais, l’allemand, le français, le coréen, le chinois et l’espagnol. La sélection s’applique immédiatement et est enregistrée."
  ko: "‘언어’에서 영어, 독일어, 프랑스어, 한국어, 중국어, 스페인어를 선택할 수 있습니다. 선택은 즉시 적용되고 저장됩니다."
  zh: "“语言”提供英语、德语、法语、韩语、中文和西班牙语。选择会立即生效并保存。"
  es: "«Idioma» ofrece inglés, alemán, francés, coreano, chino y español. La selección se aplica de inmediato y se guarda."
help.settings.restore:
  en: "On connect, restore only the topics that were visible when the app last exited. Other retained messages are ignored."
  de: "Beim Verbinden nur die Themen wiederherstellen, die beim letzten Beenden sichtbar waren. Andere retained Nachrichten werden ignoriert."
  fr: "Lors de la connexion, restaurer uniquement les sujets visibles lors de la dernière fermeture. Les autres messages retenus sont ignorés."
  ko: "연결 시 마지막 종료 때 표시되었던 토픽만 복원합니다. 다른 retained 메시지는 무시됩니다."
  zh: "连接时仅恢复上次退出时可见的主题。其他保留消息将被忽略。"
  es: "Al conectar, restaurar solo los temas visibles al cerrar la aplicación por última vez. Los demás mensajes retenidos se ignoran."
help.settings.max_history:
  en: "Number of messages kept per topic (20–2000)."
  de: "Anzahl der pro Thema gespeicherten Nachrichten (20–2000)."
  fr: "Nombre de messages conservés par sujet (20–2000)."
  ko: "토픽당 보관할 메시지 수(20–2000)입니다."
  zh: "每个主题保留的消息数量（20–2000）。"
  es: "Número de mensajes conservados por tema (20–2000)."
help.settings.max_bytes:
  en: "Maximum payload size displayed in the detail view (4 KB–1 MB). Larger payloads are truncated."
  de: "Maximale Payload-Größe in der Detailansicht (4 KB–1 MB). Größere Payloads werden gekürzt."
  fr: "Taille maximale de charge utile affichée dans les détails (4 Ko–1 Mo). Les charges utiles plus grandes sont tronquées."
  ko: "세부 보기에서 표시할 최대 페이로드 크기(4KB–1MB)입니다. 더 큰 페이로드는 잘립니다."
  zh: "详细信息视图中显示的最大负载大小（4 KB–1 MB）。更大的负载会被截断。"
  es: "Tamaño máximo de carga útil mostrado en la vista de detalles (4 KB–1 MB). Las cargas mayores se truncan."
help.settings.preview:
  en: "Shows a short payload preview in the topic tree."
  de: "Zeigt eine kurze Payload-Vorschau im Themenbaum."
  fr: "Affiche un court aperçu de la charge utile dans l’arborescence."
  ko: "토픽 트리에 짧은 페이로드 미리보기를 표시합니다."
  zh: "在主题树中显示简短的负载预览。"
  es: "Muestra una breve vista previa de la carga útil en el árbol de temas."
help.settings.search_payload:
  en: "Makes the topic filter search payload contents as well."
  de: "Lässt den Themenfilter auch Payload-Inhalte durchsuchen."
  fr: "Le filtre de sujets recherche aussi le contenu des charges utiles."
  ko: "토픽 필터가 페이로드 내용도 검색하도록 합니다."
  zh: "让主题过滤器同时搜索负载内容。"
  es: "Hace que el filtro de temas busque también en el contenido de las cargas útiles."
help.settings.highlight:
  en: "Highlights new and updated topics in the tree."
  de: "Hebt neue und aktualisierte Themen im Baum hervor."
  fr: "Met en évidence les sujets nouveaux et mis à jour dans l’arborescence."
  ko: "트리에서 새 토픽과 업데이트된 토픽을 강조합니다."
  zh: "在主题树中高亮新主题和更新主题。"
  es: "Resalta los temas nuevos y actualizados en el árbol."
help.settings.highlight_duration:
  en: "How long the highlight remains visible (0.5–10 seconds)."
  de: "Dauer der Hervorhebung (0,5–10 Sekunden)."
  fr: "Durée de la mise en évidence (0,5–10 secondes)."
  ko: "강조 표시 지속 시간(0.5–10초)입니다."
  zh: "高亮持续时间（0.5–10 秒）。"
  es: "Duración del resaltado (0,5–10 segundos)."
help.settings.pretty_json:
  en: "Formats JSON payloads automatically in the detail view."
  de: "Formatiert JSON-Payloads in der Detailansicht automatisch."
  fr: "Formate automatiquement les charges utiles JSON dans la vue détaillée."
  ko: "세부 보기에서 JSON 페이로드를 자동으로 서식 지정합니다."
  zh: "在详细信息视图中自动格式化 JSON 负载。"
  es: "Formatea automáticamente las cargas útiles JSON en la vista de detalles."
help.settings.utc:
  en: "Shows all timestamps in UTC instead of local time."
  de: "Zeigt alle Zeitstempel in UTC statt in Ortszeit."
  fr: "Affiche tous les horodatages en UTC au lieu de l’heure locale."
  ko: "모든 타임스탬프를 현지 시간 대신 UTC로 표시합니다."
  zh: "以 UTC 而不是本地时间显示所有时间戳。"
  es: "Muestra todas las marcas de tiempo en UTC en lugar de la hora local."
help.settings.config_path:
  en: "The configuration file stores profiles, settings, publish history and topic snapshots. Use Copy to copy its path."
  de: "Die Konfigurationsdatei speichert Profile, Einstellungen, Publish-Verlauf und Themen-Snapshots. „Kopieren“ kopiert den Pfad."
  fr: "Le fichier de configuration stocke les profils, paramètres, l’historique de publication et les instantanés de sujets. « Copier » copie son chemin."
  ko: "구성 파일에는 프로필, 설정, 게시 기록 및 토픽 스냅샷이 저장됩니다. ‘복사’로 경로를 복사할 수 있습니다."
  zh: "配置文件保存配置文件、设置、发布历史和主题快照。“复制”可复制其路径。"
  es: "El archivo de configuración guarda perfiles, ajustes, historial de publicación y capturas de temas. «Copiar» copia su ruta."
help.settings.save:
  en: "Changes are saved automatically shortly after editing. “Save now” writes immediately."
  de: "Änderungen werden kurz nach der Bearbeitung automatisch gespeichert. „Jetzt speichern“ schreibt sofort."
  fr: "Les modifications sont enregistrées automatiquement peu après l’édition. « Enregistrer maintenant » écrit immédiatement."
  ko: "변경 사항은 편집 후 잠시 뒤 자동 저장됩니다. ‘지금 저장’은 즉시 저장합니다."
  zh: "编辑后不久会自动保存更改。“立即保存”会立即写入。"
  es: "Los cambios se guardan automáticamente poco después de editarlos. «Guardar ahora» escribe de inmediato."
help.settings.password:
  en: "Passwords are only persisted when explicitly enabled in the profile."
  de: "Passwörter werden nur gespeichert, wenn dies im Profil ausdrücklich aktiviert ist."
  fr: "Les mots de passe ne sont conservés que s’ils sont explicitement activés dans le profil."
  ko: "비밀번호는 프로필에서 명시적으로 활성화한 경우에만 저장됩니다."
  zh: "只有在配置文件中明确启用时才会保存密码。"
  es: "Las contraseñas solo se guardan si se habilitan explícitamente en el perfil."
help.shortcuts.intro:
  en: "Available in the main window:"
  de: "Verfügbar im Hauptfenster:"
  fr: "Disponibles dans la fenêtre principale :"
  ko: "기본 창에서 사용할 수 있습니다:"
  zh: "可在主窗口中使用："
  es: "Disponibles en la ventana principal:"
help.troubleshooting.intro:
  en: "If something does not work as expected, check these points:"
  de: "Wenn etwas nicht wie erwartet funktioniert, prüfe diese Punkte:"
  fr: "Si quelque chose ne fonctionne pas comme prévu, vérifiez ces points :"
  ko: "예상대로 동작하지 않으면 다음을 확인하세요:"
  zh: "如果出现异常，请检查以下几点："
  es: "Si algo no funciona como se espera, comprueba estos puntos:"
help.troubleshooting.subscription:
  en: "No topics arrive: make sure the subscription topic is not empty and matches what you publish, for example # or sensor/#."
  de: "Es kommen keine Themen an: Stelle sicher, dass das Subscription-Thema nicht leer ist und zu dem passt, was du veröffentlichst, z. B. # oder sensor/#."
  fr: "Aucun sujet n’arrive : vérifiez que le sujet d’abonnement n’est pas vide et correspond à ce que vous publiez, par exemple # ou sensor/#."
  ko: "토픽이 도착하지 않음: 구독 토픽이 비어 있지 않고 게시하는 대상과 일치하는지 확인하세요. 예: # 또는 sensor/#."
  zh: "收不到主题：请确认订阅主题不为空且与发布内容匹配，例如 # 或 sensor/#。"
  es: "No llegan temas: asegúrate de que el tema de suscripción no esté vacío y coincida con lo que publicas, por ejemplo # o sensor/#."
help.troubleshooting.leading_slash:
  en: "A published topic only appears if the client is subscribed to a matching filter. Leading slashes matter: /sensor and sensor are different topics."
  de: "Ein veröffentlichtes Thema erscheint nur, wenn der Client einen passenden Filter abonniert hat. Führende Schrägstriche zählen: /sensor und sensor sind verschiedene Themen."
  fr: "Un sujet publié n’apparaît que si le client est abonné à un filtre correspondant. Les barres obliques initiales comptent : /sensor et sensor sont des sujets différents."
  ko: "게시한 토픽은 클라이언트가 일치하는 필터를 구독한 경우에만 나타납니다. 앞의 슬래시가 중요합니다: /sensor와 sensor는 다른 토픽입니다."
  zh: "只有在客户端订阅了匹配的过滤器时，发布的消息才会出现。开头的斜杠很重要：/sensor 和 sensor 是不同的主题。"
  es: "Un tema publicado solo aparece si el cliente está suscrito a un filtro coincidente. Las barras iniciales importan: /sensor y sensor son temas distintos."
help.troubleshooting.host_scheme:
  en: "When a WebSocket connection fails, enter the host without ws:// or wss:// and choose the scheme through Transport."
  de: "Wenn eine WebSocket-Verbindung fehlschlägt, gib den Host ohne ws:// oder wss:// ein und wähle das Schema über den Transport."
  fr: "Si une connexion WebSocket échoue, saisissez l’hôte sans ws:// ni wss:// et choisissez le schéma via le transport."
  ko: "WebSocket 연결이 실패하면 ws:// 또는 wss:// 없이 호스트를 입력하고 전송 설정에서 스킴을 선택하세요."
  zh: "如果 WebSocket 连接失败，请输入不带 ws:// 或 wss:// 的主机名，并在传输设置中选择协议。"
  es: "Si falla una conexión WebSocket, introduce el host sin ws:// ni wss:// y elige el esquema mediante el transporte."
help.troubleshooting.ca:
  en: "For TLS or WSS certificate errors, check the CA file; it must contain PEM or DER certificates."
  de: "Bei TLS- oder WSS-Zertifikatsfehlern prüfe die CA-Datei; sie muss PEM- oder DER-Zertifikate enthalten."
  fr: "En cas d’erreur de certificat TLS ou WSS, vérifiez le fichier CA ; il doit contenir des certificats PEM ou DER."
  ko: "TLS/WSS 인증서 오류가 나면 CA 파일을 확인하세요. PEM 또는 DER 인증서가 있어야 합니다."
  zh: "出现 TLS 或 WSS 证书错误时，请检查 CA 文件；它必须包含 PEM 或 DER 证书。"
  es: "En errores de certificado TLS o WSS, comprueba el archivo CA; debe contener certificados PEM o DER."
help.troubleshooting.one_connection:
  en: "Only one connection can be active. Connecting another profile disconnects the previous one."
  de: "Es kann nur eine Verbindung aktiv sein. Das Verbinden eines anderen Profils trennt das vorherige."
  fr: "Une seule connexion peut être active. La connexion d’un autre profil déconnecte le précédent."
  ko: "하나의 연결만 활성화할 수 있습니다. 다른 프로필을 연결하면 이전 연결이 끊깁니다."
  zh: "只能有一个活动连接。连接另一个配置文件会断开之前的连接。"
  es: "Solo puede haber una conexión activa. Al conectar otro perfil se desconecta el anterior."
help.troubleshooting.log:
  en: "The Log button in the top bar opens the connection diagnostics with connection details and the latest events; the broker info card shows the last line. Configuration problems appear in Settings and as toasts."
  de: "Der Protokoll-Button in der oberen Leiste öffnet die Verbindungsdiagnose mit Verbindungsdetails und den letzten Ereignissen; die Broker-Info zeigt die letzte Zeile. Konfigurationsprobleme erscheinen in den Einstellungen und als Toast."
  fr: "Le bouton Journal dans la barre supérieure ouvre le diagnostic de connexion avec les détails de la connexion et les derniers événements ; la fiche broker affiche la dernière ligne. Les problèmes de configuration apparaissent dans les paramètres et sous forme de notifications."
  ko: "상단 표시줄의 로그 버튼을 누르면 연결 세부 정보와 최근 이벤트가 담긴 연결 진단이 열립니다. 브로커 정보 카드에는 마지막 줄이 표시됩니다. 구성 문제는 설정 창과 토스트로 표시됩니다."
  zh: "顶部栏的“日志”按钮会打开包含连接详情和最新事件的连接诊断；Broker 信息卡显示最后一行。配置问题会显示在设置窗口和通知中。"
  es: "El botón Registro de la barra superior abre el diagnóstico de conexión con los detalles de la conexión y los últimos eventos; la tarjeta de información del broker muestra la última línea. Los problemas de configuración aparecen en Ajustes y como notificaciones."
help.troubleshooting.config:
  en: "If settings are not saved, check the configuration path and the file permissions."
  de: "Wenn Einstellungen nicht gespeichert werden, prüfe Konfigurationspfad und Dateirechte."
  fr: "Si les paramètres ne sont pas enregistrés, vérifiez le chemin de configuration et les permissions du fichier."
  ko: "설정이 저장되지 않으면 구성 경로와 파일 권한을 확인하세요."
  zh: "如果设置未保存，请检查配置路径和文件权限。"
  es: "Si los ajustes no se guardan, comprueba la ruta de configuración y los permisos del archivo."
help.about.license:
  en: "Released under the Apache 2.0 license."
  de: "Veröffentlicht unter der Apache-2.0-Lizenz."
  fr: "Publié sous licence Apache 2.0."
  ko: "Apache 2.0 라이선스로 배포됩니다."
  zh: "基于 Apache 2.0 许可证发布。"
  es: "Publicado bajo la licencia Apache 2.0."

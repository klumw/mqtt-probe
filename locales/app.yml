  en: "The tree stays empty until connected. After connecting, the topics from the last session are loaded; retained messages for other topics are ignored. New live messages are still shown."
  de: "Vor dem Verbindungsaufbau bleibt der Baum leer. Danach werden die Themen der letzten Sitzung geladen; retained Nachrichten anderer Themen werden ignoriert. Neue Live-Nachrichten werden weiterhin angezeigt."
  fr: "L’arborescence reste vide jusqu’à la connexion. Ensuite, les sujets de la dernière session sont chargés ; les messages retenus des autres sujets sont ignorés. Les nouveaux messages en direct restent affichés."
  ko: "연결 전에는 트리가 비어 있습니다. 연결 후 마지막 세션의 토픽이 로드되며 다른 토픽의 retained 메시지는 무시됩니다. 새 라이브 메시지는 계속 표시됩니다."
  zh: "连接前树保持为空。连接后会加载上次会话的主题；其他主题的保留消息将被忽略。新的实时消息仍会显示。"
  es: "El árbol permanece vacío hasta conectar. Tras conectar, se cargan los temas de la última sesión; los mensajes retenidos de otros temas se ignoran. Los nuevos mensajes en vivo se siguen mostrando."

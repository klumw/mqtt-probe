  ko: "상호 TLS용 클라이언트 인증서 체인(PEM 또는 DER). 일치하는 개인 키가 필요합니다."
  zh: "用于双向 TLS 的客户端证书链（PEM 或 DER）。需要匹配的私钥。"
  es: "Cadena de certificados de cliente para TLS mutuo (PEM o DER). Requiere una clave privada correspondiente."

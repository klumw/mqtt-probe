editor.ca_certificate_help:
  en: "Additional root certificate for TLS (PEM or DER). System certificates remain trusted."
  de: "Zusätzliches Root-Zertifikat für TLS (PEM oder DER). Systemzertifikate bleiben vertrauenswürdig."
  fr: "Certificat racine supplémentaire pour TLS (PEM ou DER). Les certificats système restent approuvés."
  ko: "TLS용 추가 루트 인증서(PEM 또는 DER). 시스템 인증서는 계속 신뢰됩니다."
  zh: "用于 TLS 的额外根证书（PEM 或 DER）。系统证书仍然受信任。"
  es: "Certificado raíz adicional para TLS (PEM o DER). Los certificados del sistema siguen siendo de confianza."
